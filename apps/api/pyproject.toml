[project]
name = "screener-api"
version = "0.1.0"
description = "Secure AI resume screener — API"
# Pinned to 3.12: spaCy models, torch, and Presidio wheels lag new CPython releases,
# and M3-M5 depend on all three. See ADR-0004.
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    # Required by SQLAlchemy's async layer. SQLAlchemy declares it only for some
    # platforms, so resolving on macOS silently omits it and every async session
    # fails at runtime while the unit tests still pass. Pin it explicitly.
    "greenlet>=3.1",
    "alembic>=1.14",
    "structlog>=24.4",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "cryptography>=50.0",
    # Content sniffing by magic bytes. Needs libmagic (brew install libmagic /
    # apt install libmagic1) — extension and Content-Type are attacker-controlled.
    "python-magic>=0.4.27",
    "pypdf>=5.1",            # MIT; see ADR-0002 for why not PyMuPDF
    "python-multipart>=0.0.20",
    "python-docx>=1.1",
    # Not optional: python-docx uses lxml, whose default parser resolves
    # external entities. defusedxml is what stops XXE in a DOCX.
    "defusedxml>=0.7",
    "pytesseract>=0.3.13",
    "pdf2image>=1.17",       # shells out to poppler's pdftoppm; no AGPL dependency
    "pillow>=11.0",
    "langdetect>=1.0.9",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.8",
    # ONNX rather than sentence-transformers: 109 MB installed against ~800 MB
    # for torch, for the same BAAI/bge-small-en-v1.5 weights. On a laptop-first
    # project the image size is a real constraint. See ADR-0010.
    "fastembed>=0.5",
    "pgvector>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "mypy>=1.13",
    "ruff>=0.8",
    "bandit>=1.8",
    "pytest-asyncio>=0.25",
    "testcontainers[postgres]>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/screener_api"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RUF", "S"]
# S101 (assert) is fine in tests; handled per-file below.
ignore = ["S104"]

[tool.ruff.lint.per-file-ignores]
# Fake credentials are the point of these tests, not a finding.
"tests/*" = ["S101", "S105", "S106", "S107"]
"alembic/*" = ["N999", "S"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["screener_api"]

[[tool.mypy.overrides]]
# No py.typed marker upstream. Scoped to these packages rather than global, so a
# genuinely untyped import elsewhere still fails.
module = [
    "alembic.*", "pytesseract.*", "pdf2image.*", "langdetect.*",
    "defusedxml.*", "presidio_analyzer.*", "presidio_anonymizer.*", "spacy.*",
    "fastembed.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: needs a live database (testcontainers)"]
asyncio_mode = "auto"
