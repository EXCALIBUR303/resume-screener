name: deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm'
        required: true

permissions:
  contents: read

jobs:
  preflight:
    name: preflight (secrets and gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirmation
        run: |
          [ "${{ inputs.confirm }}" = "deploy" ] || {
            echo "Type 'deploy' to confirm."; exit 1; }
      # Fail here rather than after the containers are live. A half-configured
      # deploy that boots and dies on first upload is worse than one that never
      # starts.
      - name: Required secrets are present
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          APP_KEK: ${{ secrets.APP_KEK }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          missing=0
          for v in NEON_DATABASE_URL S3_BUCKET S3_ACCESS_KEY_ID \
                   S3_SECRET_ACCESS_KEY APP_KEK JWT_SECRET; do
            if [ -z "${!v}" ]; then echo "missing secret: $v"; missing=1; fi
          done
          [ "$missing" = "0" ] || {
            echo; echo "See docs/deployment.md for how to obtain these."; exit 1; }
      - name: Deploy secrets must differ from the development defaults
        env:
          APP_KEK: ${{ secrets.APP_KEK }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          case "$APP_KEK$JWT_SECRET" in
            *CHANGE_ME*) echo "Placeholder secret in a deploy. Refusing."; exit 1 ;;
          esac
          echo "secrets look real"

  migrate:
    name: migrate the managed database
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "apps/api/requirements.lock"
      - working-directory: apps/api
        run: uv venv --python 3.12 && uv pip install -e ".[dev]"
      - name: Alembic upgrade head
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          APP_ENV: prod
          APP_KEK: ${{ secrets.APP_KEK }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.NEON_PASSWORD }}
        run: .venv/bin/alembic upgrade head

  images:
    name: build and publish images
    needs: migrate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tagged by commit SHA and pushed by digest, so a rollback is redeploying
      # the previous digest rather than rebuilding and hoping.
      - name: Build and push api
        run: |
          docker build -f infra/docker/Dockerfile.api \
            -t ghcr.io/${{ github.repository }}/api:${{ github.sha }} .
          docker push ghcr.io/${{ github.repository }}/api:${{ github.sha }}
      - name: Build and push worker
        run: |
          docker build -f infra/docker/Dockerfile.worker \
            -t ghcr.io/${{ github.repository }}/worker:${{ github.sha }} .
          docker push ghcr.io/${{ github.repository }}/worker:${{ github.sha }}
      - name: Record the digests for rollback
        run: |
          docker inspect --format='{{index .RepoDigests 0}}' \
            ghcr.io/${{ github.repository }}/api:${{ github.sha }} | tee digests.txt
          docker inspect --format='{{index .RepoDigests 0}}' \
            ghcr.io/${{ github.repository }}/worker:${{ github.sha }} | tee -a digests.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-digests
          path: digests.txt
