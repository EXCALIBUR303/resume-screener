name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        working-directory: apps/api
        run: uv venv --python 3.12 && uv pip install -e ".[dev]"
      - name: Lint
        working-directory: apps/api
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
      - name: Typecheck
        working-directory: apps/api
        run: .venv/bin/mypy
      - name: Test
        working-directory: apps/api
        # Every test runs offline against the stub provider — no model, no network.
        run: .venv/bin/pytest --cov=screener_api --cov-report=term-missing

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - working-directory: apps/web
        run: pnpm typecheck
      - working-directory: apps/web
        run: pnpm lint

  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate throwaway secrets
        run: |
          cp .env.example .env
          {
            echo "APP_ENV=test"
            echo "POSTGRES_PASSWORD=$(openssl rand -base64 24)"
            echo "APP_KEK=$(openssl rand -base64 32)"
            echo "JWT_SECRET=$(openssl rand -base64 32)"
          } >> .env
      - name: AC-15 cold start under 180s
        run: bash scripts/smoke.sh
      - name: Migrations apply and roll back
        run: |
          docker compose exec -T api alembic upgrade head
          docker compose exec -T api alembic downgrade base
          docker compose exec -T api alembic upgrade head
      - if: always()
        run: docker compose logs --tail=50
