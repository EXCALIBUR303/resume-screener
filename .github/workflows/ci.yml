name: ci

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: api (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - name: Install
        working-directory: apps/api
        run: uv venv --python 3.12 && uv pip install -e ".[dev]"
      - name: spaCy model (redaction NER)
        working-directory: apps/api
        run: .venv/bin/python -m spacy download en_core_web_sm
      - name: Lint
        working-directory: apps/api
        run: .venv/bin/ruff check . && .venv/bin/ruff format --check .
      - name: Typecheck
        working-directory: apps/api
        run: .venv/bin/mypy
      - name: Tests
        working-directory: apps/api
        # Every test runs on the deterministic stub provider: offline, free,
        # reproducible. No model is called anywhere in CI.
        env:
          LLM_PROVIDER: stub
        run: .venv/bin/pytest -m "not integration" --cov=screener_api --cov-report=term-missing

  acceptance:
    name: acceptance criteria
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - working-directory: apps/api
        run: uv venv --python 3.12 && uv pip install -e ".[dev]"
      - working-directory: apps/api
        run: .venv/bin/python -m spacy download en_core_web_sm
      # Each criterion is a named gate so a failure says WHICH guarantee broke,
      # not merely that "tests failed".
      - name: "AC-1 parse coverage"
        working-directory: apps/api
        run: .venv/bin/pytest tests/test_parse_corpus.py -q
      - name: "AC-2 / AC-3 redaction recall and zero PII egress"
        working-directory: apps/api
        run: .venv/bin/pytest tests/test_redaction.py tests/test_pii_egress.py -q
      - name: "AC-4 / AC-5 / AC-11 schema, evidence gating, consistency"
        working-directory: apps/api
        run: .venv/bin/pytest tests/test_scoring.py -q
      - name: "AC-6 / AC-7 authorization matrix"
        working-directory: apps/api
        run: .venv/bin/pytest tests/test_authz_matrix.py -q
      - name: "AC-8 malicious upload corpus"
        working-directory: apps/api
        run: .venv/bin/pytest tests/test_upload_corpus.py -q
      - name: "AC-9 injection corpus (40 cases)"
        working-directory: apps/api
        run: .venv/bin/pytest tests/test_ac9_injection_suite.py -q
      - name: "Interview grounding and lawfulness"
        working-directory: apps/api
        run: .venv/bin/pytest tests/test_interview.py -q

  integration:
    name: integration (real Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - working-directory: apps/api
        run: uv venv --python 3.12 && uv pip install -e ".[dev]"
      - name: Integration tests
        working-directory: apps/api
        # These run real Alembic migrations against a containerised Postgres, so
        # everything migrations add in raw SQL — the tsvector column, the GIN and
        # HNSW indexes, the append-only trigger, the grants — is actually tested.
        run: .venv/bin/pytest -m integration -q

  web:
    name: web (types, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - working-directory: apps/web
        run: npm ci || npm install --no-audit --no-fund
      - working-directory: apps/web
        run: npx tsc --noEmit
      - working-directory: apps/web
        run: npx biome check .

  stack:
    name: stack (cold start, migrations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Throwaway secrets
        run: |
          cp .env.example .env
          {
            echo "APP_ENV=test"
            echo "POSTGRES_PASSWORD=$(openssl rand -base64 24)"
            echo "APP_KEK=$(openssl rand -base64 32)"
            echo "JWT_SECRET=$(openssl rand -base64 32)"
            echo "LLM_PROVIDER=stub"
          } >> .env
      - name: "AC-15 cold start under 180s"
        run: bash scripts/smoke.sh
      - if: always()
        run: docker compose logs --tail=40
