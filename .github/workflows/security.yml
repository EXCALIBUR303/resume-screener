name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly, so a new CVE in a stale dep still surfaces

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # gitleaks needs history

      # The binary rather than gitleaks-action: the action exits 1 even when it
      # reports "no leaks found" (it gates on a licence for some repo types),
      # and running the binary means CI and `make sec` execute the same tool
      # with the same .gitleaksignore.
      - name: Secrets (gitleaks)
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --no-banner --redact --exit-code 1

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "apps/api/requirements.lock"
      - name: Install
        working-directory: apps/api
        run: uv venv --python 3.12 && uv pip install -e ".[dev]"

      - name: SAST (bandit)
        working-directory: apps/api
        run: .venv/bin/bandit -q -r src -ll

      # No `|| fallback`: the original form fell through to auditing an empty
      # environment and reported "No known vulnerabilities found" while three
      # real CVEs sat in `cryptography` — the library doing our envelope
      # encryption. A security gate that can pass by failing over is worse than
      # no gate, because it reads as evidence.
      #
      # --skip-editable excludes our own package. --strict is deliberately OFF:
      # it treats "not on PyPI" as an error, and the spaCy model is installed
      # from a GitHub URL and is legitimately unauditable. Real vulnerabilities
      # still exit non-zero — verified by planting urllib3 1.26.5, which
      # produced 13 findings and exit 1.
      - name: Dependency audit (pip-audit)
        working-directory: apps/api
        run: |
          .venv/bin/python -m pip --version >/dev/null 2>&1 || uv pip install pip -q
          uv pip install pip-audit -q
          .venv/bin/pip-audit --skip-editable

      - name: Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/python p/security-audit p/secrets .semgrep.yml

      - name: JS dependency audit
        working-directory: apps/web
        run: npm audit --audit-level=high

  containers:
    name: container image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -f infra/docker/Dockerfile.api -t screener-api:scan .
          docker build -f infra/docker/Dockerfile.worker -t screener-worker:scan .
      - name: Trivy (api)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: screener-api:scan
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Trivy (worker)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: screener-worker:scan
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      # An SBOM per build is what makes "was this build affected by CVE-X"
      # answerable after the fact. Trivy is already here and emits CycloneDX,
      # so this costs one step rather than a new dependency.
      - name: SBOM (api image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: screener-api:scan
          format: cyclonedx
          output: sbom-api.cdx.json
      - name: SBOM (worker image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: screener-worker:scan
          format: cyclonedx
          output: sbom-worker.cdx.json
      # The repository itself, so the SBOM covers the pinned Python and Node
      # dependency graphs and not only what landed in an image layer.
      - name: SBOM (repository)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom-repo.cdx.json
      - name: Summarise
        run: |
          for f in sbom-*.cdx.json; do
            echo "$f: $(python3 -c "import json,sys; print(len(json.load(open('$f')).get('components',[])))" ) components"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom
          path: sbom-*.cdx.json
          retention-days: 90

  dast:
    name: ZAP baseline against the running stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Throwaway secrets
        run: |
          cp .env.example .env
          {
            echo "APP_ENV=test"
            echo "POSTGRES_PASSWORD=$(openssl rand -base64 24)"
            echo "APP_KEK=$(openssl rand -base64 32)"
            echo "JWT_SECRET=$(openssl rand -base64 32)"
            echo "LLM_PROVIDER=stub"
          } >> .env
      - name: Start the stack
        run: |
          docker compose up -d --build db api
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/healthz && break || sleep 3
          done
      # The scanner directly, not zaproxy/action-baseline: the action's scan
      # passed (FAIL-NEW 0, PASS 68) and then failed uploading its report through
      # a removed artifact API. Same reasoning as gitleaks above — run the tool,
      # not the wrapper, so a broken wrapper cannot fail a clean scan.
      - name: ZAP baseline
        run: |
          docker run --rm --network=host \
            -v "$PWD:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8000 \
              -c .zap/rules.tsv -a -j \
              -r zap-report.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-baseline-report
          path: zap-report.html
          if-no-files-found: ignore

      - if: always()
        run: docker compose logs --tail=40
