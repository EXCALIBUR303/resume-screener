# Local stack. Profiles add optional services:
#   docker compose --profile clamav up -d
name: resume-screener

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-screener}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-screener}
    # Host port 5433, not 5432: a native Homebrew PostgreSQL is already bound to
    # 127.0.0.1:5432 on this machine and wins for localhost connections. Anything
    # run from the host would silently hit the wrong database. Inside the compose
    # network the API still reaches it as db:5432.
    ports: ["5433:5432"]
    volumes:
      - "pgdata:/var/lib/postgresql/data"
      # The socket directory is shared with worker-parse, which has
      # network_mode: none and reaches the database this way.
      - "pgsocket:/var/run/postgresql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-screener} -d $${POSTGRES_DB:-screener}"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    env_file: [.env]
    environment:
      POSTGRES_HOST: db
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
    read_only: true
    tmpfs: ["/tmp"]
    volumes: ["blobs:/data/files"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g

  worker-parse:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    env_file: [.env]
    environment:
      # Empty host + PGHOST directory = connect over the unix socket. There is
      # no TCP stack available to this container at all.
      POSTGRES_HOST: ""
      POSTGRES_SOCKET_DIR: /var/run/postgresql
      WORKER_TYPES: parse
    depends_on:
      db: { condition: service_healthy }
    # The whole point of this service. It is the only process that touches
    # attacker-controlled bytes, so it is given nothing to exfiltrate with:
    # no network at all, a read-only root filesystem, no capabilities, non-root.
    # Everything else here is secondary to this one line.
    network_mode: none
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    volumes:
      - "blobs:/data/files"
      - "pgsocket:/var/run/postgresql"
    restart: unless-stopped

  worker-ai:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    env_file: [.env]
    environment:
      POSTGRES_HOST: db
      WORKER_TYPES: embed,score
    depends_on:
      db: { condition: service_healthy }
    # Unlike worker-parse this pool DOES need egress, to reach the model host.
    # It is a separate service precisely so that privilege is not granted to the
    # process handling attacker-controlled bytes. It never touches raw uploads:
    # it reads redacted text and chunk vectors only.
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    volumes: ["blobs:/data/files"]
    restart: unless-stopped

  # Opt-in: `docker compose --profile observability up -d`
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["observability"]
    volumes:
      - "./infra/prometheus:/etc/prometheus:ro"
      - "promdata:/prometheus"
    ports: ["9090:9090"]
    security_opt: ["no-new-privileges:true"]

  grafana:
    image: grafana/grafana:11.5.1
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-admin}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - "./infra/grafana/provisioning:/etc/grafana/provisioning:ro"
      - "./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro"
      - "grafanadata:/var/lib/grafana"
    ports: ["3001:3000"]
    depends_on: [prometheus]
    security_opt: ["no-new-privileges:true"]

volumes:
  pgdata:
  promdata:
  grafanadata:
  blobs:
  pgsocket:
